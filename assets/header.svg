<svg width="950" height="220" viewBox="0 0 950 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Matte Obsidian Background -->
  <rect width="950" height="220" fill="#09090B" />
  
  <!-- Subtle Technical Grid Lines -->
  <defs>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181B" stroke-width="1" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#27272A" stroke-width="0.5" stroke-opacity="0.6" />
    </pattern>
  </defs>
  <rect width="950" height="220" fill="url(#cad-grid)" />

  <!-- Outer Architectural Border with Corner Registration Marks -->
  <rect x="20" y="20" width="910" height="180" fill="none" stroke="#27272A" stroke-width="1" />
  
  <!-- Corner Crosshairs (+) -->
  <g stroke="#71717A" stroke-width="1">
    <!-- Top-Left -->
    <line x1="14" y1="20" x2="26" y2="20" />
    <line x1="20" y1="14" x2="20" y2="26" />
    <!-- Top-Right -->
    <line x1="924" y1="20" x2="936" y2="20" />
    <line x1="930" y1="14" x2="930" y2="26" />
    <!-- Bottom-Left -->
    <line x1="14" y1="200" x2="26" y2="200" />
    <line x1="20" y1="194" x2="20" y2="206" />
    <!-- Bottom-Right -->
    <line x1="924" y1="200" x2="936" y2="200" />
    <line x1="930" y1="194" x2="930" y2="206" />
  </g>

  <!-- Header Metadata Strip -->
  <g font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="9" fill="#71717A" letter-spacing="1.2">
    <text x="45" y="44">SYS.ID // LR-2026</text>
    <text x="260" y="44">DISCIPLINE: INDUSTRIAL ENGINEERING &amp; SOFTWARE STUDENT</text>
    <text x="765" y="44">LOC: ICESI / COLOMBIA</text>
  </g>
  <line x1="20" y1="54" x2="930" y2="54" stroke="#27272A" stroke-width="1" />

  <!-- Main Name Display (Swiss Typography) -->
  <text x="45" y="105" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">
    LUIS ERNESTO RODRÍGUEZ
  </text>

  <!-- Subtitle / Role -->
  <text x="46" y="132" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0.1">
    Estudiante de Ingeniería Industrial (Universidad Icesi) // Estudiante de Desarrollo de Software
  </text>

  <!-- Technical Spec Boxes / Focus Areas -->
  <g transform="translate(45, 152)">
    <!-- Box 1 -->
    <g>
      <rect x="0" y="0" width="180" height="26" fill="#121215" stroke="#27272A" stroke-width="1" />
      <text x="12" y="17" fill="#E4E4E7" font-family="'SF Mono', Menlo, monospace" font-size="9.5" font-weight="600" letter-spacing="0.8">01 / APRENDIZAJE &amp; PROYECTOS</text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="175" height="26" fill="#121215" stroke="#27272A" stroke-width="1" />
      <text x="12" y="17" fill="#E4E4E7" font-family="'SF Mono', Menlo, monospace" font-size="9.5" font-weight="600" letter-spacing="0.8">02 / SISTEMAS VISUALES</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(375, 0)">
      <rect x="0" y="0" width="185" height="26" fill="#121215" stroke="#27272A" stroke-width="1" />
      <text x="12" y="17" fill="#E4E4E7" font-family="'SF Mono', Menlo, monospace" font-size="9.5" font-weight="600" letter-spacing="0.8">03 / AUTOMATIZACIÓN &amp; IA</text>
    </g>

    <!-- Box 4 -->
    <g transform="translate(570, 0)">
      <rect x="0" y="0" width="190" height="26" fill="#121215" stroke="#27272A" stroke-width="1" />
      <text x="12" y="17" fill="#E4E4E7" font-family="'SF Mono', Menlo, monospace" font-size="9.5" font-weight="600" letter-spacing="0.8">04 / PROCESOS &amp; NEGOCIO</text>
    </g>
  </g>

  <!-- Right Technical Coordinate / Blueprint Block -->
  <g transform="translate(800, 75)">
    <rect x="0" y="0" width="105" height="95" fill="#0C0C0E" stroke="#27272A" stroke-width="1" />
    <!-- Geometric Isometric Drafting Wireframe -->
    <path d="M 52 20 L 82 36 L 52 52 L 22 36 Z" fill="none" stroke="#52525B" stroke-width="1" />
    <path d="M 22 36 L 22 66 L 52 82 L 52 52 Z" fill="none" stroke="#3F3F46" stroke-width="1" />
    <path d="M 82 36 L 82 66 L 52 82 Z" fill="none" stroke="#27272A" stroke-width="1" />
    <circle cx="52" cy="52" r="2" fill="#E4E4E7" />
  </g>
</svg>
